events {
    worker_connections 1024;
}

http {
    upstream sevasetu_servers {
        # Docker internal DNS will resolve 'app' to all running containers of the service
        server app:3000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://sevasetu_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Custom header to see which instance handled the request
            add_header X-Handled-By $upstream_addr;
        }

        # Enable SSE support
        location /api/chat/stream {
            proxy_pass http://sevasetu_servers;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding on;
            proxy_read_timeout 1h;
        }
    }
}
