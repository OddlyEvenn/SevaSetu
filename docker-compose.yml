services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # REMOVED PORT 3000 to force traffic through Load Balancer
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/sevasetu
      - DIRECT_URL=postgresql://user:password@db:5432/sevasetu
      - JWT_SECRET=${JWT_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sevasetu_net

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=sevasetu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d sevasetu"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sevasetu_net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - sevasetu_net

networks:
  sevasetu_net:
    driver: bridge

volumes:
  postgres_data:
